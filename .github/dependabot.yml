# Dependabot opens its PRs against the `dev` integration branch, not the default
# branch — see CLAUDE.md.
version: 2
updates:
  - package-ecosystem: 'npm'
    commit-message:
      prefix: 'fix(deps)'
      prefix-development: 'chore(deps-dev)'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    # Mirror the npm `minimumReleaseAge` (3 days): hold updates back until a
    # release has been public for a few days, dodging just-published malicious
    # or broken versions. Applies to every ecosystem below too.
    cooldown:
      default-days: 3
    labels:
      - 'dependencies'
      - 'stack: javascript'
    # TypeScript 7 is the Go port, and `vue-tsc` does not work with it — a major
    # bump takes `pnpm typecheck` out. Held until vue-tsc supports it; lift this
    # entry, don't work around it.
    ignore:
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    commit-message:
      prefix: 'chore(deps)'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 3
    labels:
      - 'dependencies'
      - 'stack: github-actions'
    groups:
      actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  # ---------------------------------------------------------------------------
  # Security updates.
  #
  # Every block above sets `target-branch`, and that switches OFF `labels` and
  # `commit-message` for security updates — they always target the DEFAULT
  # branch and fall back to Dependabot's own defaults (bare `javascript` labels,
  # wrong commit prefix). The blocks below re-declare each ecosystem WITHOUT
  # `target-branch`, so they own the default branch and their labels do apply.
  # `open-pull-requests-limit: 0` disables VERSION updates here (those stay with
  # the blocks above); security updates are exempt from that limit.
  #
  # Do not add `target-branch` below — that would re-break the labels.
  # ---------------------------------------------------------------------------

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
    commit-message:
      prefix: 'fix(deps)'
      prefix-development: 'chore(deps-dev)'
    labels:
      - 'dependencies'
      - 'stack: javascript'
    # TypeScript 7 is the Go port, and `vue-tsc` does not work with it — see the
    # version-update block above. Repeated here because the two blocks are
    # independent.
    ignore:
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 0
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
      - 'stack: github-actions'
